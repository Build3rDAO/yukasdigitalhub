    [['name',!nm],['email',!/^\S+@\S+\.\S+$/.test(em)]].forEach(function(x){f.querySelector('[data-e="'+x[0]+'"]').textContent=x[1]?'Please fill in this field correctly.':'';if(x[1])ok=false});
    if(!ok)return;DB.profile={name:nm,email:em};FL='Profile created. “'+b.t+'” is now in your library.';
  }else FL='“'+b.t+'” was added to your profile.';
  if(DB.owned.indexOf(b.id)<0)DB.owned.push(b.id);save();location.hash='#academy/profile';
});
document.addEventListener('click',function(e){
  var d=e.target.closest('[data-act="done"]');if(!d)return;
  var id=d.dataset.b,c=+d.dataset.c,a=DB.done[id]||(DB.done[id]=[]),i=a.indexOf(c);
  if(i>-1)a.splice(i,1);else a.push(c);save();
  view.innerHTML=V.academy('read/'+id+'/'+c);
});
/* router with transition lock */
var stage=$('#stage'),fx=$('#fx'),home=$('#home'),view=$('#view'),busy=false,pending=null,warp=0;
function route(){
  var h=(location.hash||'#home').slice(1).split('/'),k=h[0],sub=h.slice(1).join('/');
  if(busy){pending=true;return}
  var pk=curK;curK=k;if(k==='academy'&&pk==='academy'){view.innerHTML=V.academy(sub);view.scrollTop=0;return}
  busy=true;warp=1;fx.classList.add('in');
  setTimeout(function(){
    if(k==='home'||!V[k]){home.classList.add('on');view.classList.remove('on')}
    else{home.classList.remove('on');view.innerHTML=k==='services'&&sub?V.service(sub):V[k](sub);view.classList.add('on');view.scrollTop=0;
      var hd=view.querySelector('h2');if(hd){hd.setAttribute('tabindex','-1');hd.focus({preventScroll:true})}}
    place();stage.classList.remove('rev');void stage.offsetWidth;stage.classList.add('rev');fx.classList.remove('in');
    setTimeout(function(){busy=false;warp=0;if(pending){pending=null;route()}},700);
  },560);
}
addEventListener('hashchange',function(){closeMenu(true);route()});
if(location.hash&&location.hash!=='#home'){home.classList.remove('on')}route();

/* menu */
var panel=$('#panel'),mb=$('#menuBtn'),last=null;
function openMenu(){last=document.activeElement;panel.classList.add('open');mb.setAttribute('aria-expanded','true');setTimeout(function(){panel.querySelector('a').focus()},50)}
function closeMenu(q){if(!panel.classList.contains('open'))return;panel.classList.remove('open');mb.setAttribute('aria-expanded','false');if(!q&&last)last.focus()}
mb.onclick=openMenu;$('#closeBtn').onclick=function(){closeMenu()};
addEventListener('keydown',function(e){
  if(e.key==='Escape')closeMenu();
  if(e.key==='Tab'&&panel.classList.contains('open')){var f=panel.querySelectorAll('a,button'),a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
$('#ctaBtn').onclick=function(){
  orbit.querySelectorAll('.node').forEach(function(n,i){n.classList.remove('pulse');void n.offsetWidth;n.style.animationDelay=(i*90)+'ms';n.classList.add('pulse')});
  orbit.querySelector('.node').focus();
};

/* bubbles */
var cv=$('#bg'),cx=cv.getContext('2d'),B=[],run=true,W0,H0,lt=0,rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){var d=Math.min(devicePixelRatio||1,2);W0=innerWidth;H0=innerHeight;cv.width=W0*d;cv.height=H0*d;cx.setTransform(d,0,0,d,0,0)}
function mk(r){var s=12+Math.random()*(W0<700?38:64);return{x:Math.random()*W0,y:r?Math.random()*H0:H0+s*2,s:s,v:.25+Math.random()*.5,p:Math.random()*6.28,w:.4+Math.random()*.6,c:Math.random()<.65?'96,165,250':Math.random()<.5?'34,211,238':'139,92,246'}}
function init(){size();B=[];for(var i=0,n=W0<700?14:22;i<n;i++)B.push(mk(true))}
function frame(t){
  if(!run)return;var dt=Math.min(t-lt,50)||16;lt=t;cx.clearRect(0,0,W0,H0);
  for(var i=0;i<B.length;i++){var b=B[i];
    if(!rm){b.y-=b.v*dt*.03*(warp?5:1);b.x+=Math.sin(t*.0005*b.w+b.p)*.3}
    if(b.y<-b.s*2){B[i]=mk(false);continue}
    var g=cx.createRadialGradient(b.x-b.s*.3,b.y-b.s*.3,b.s*.1,b.x,b.y,b.s);
    g.addColorStop(0,'rgba('+b.c+',.30)');g.addColorStop(1,'rgba('+b.c+',.04)');
    cx.fillStyle=g;cx.beginPath();cx.arc(b.x,b.y,b.s,0,6.283);cx.fill();
    cx.strokeStyle='rgba('+b.c+',.32)';cx.lineWidth=1;cx.stroke()}
  if(!rm)requestAnimationFrame(frame);
}
init();requestAnimationFrame(frame);
addEventListener('resize',function(){init();if(rm)frame(0)});
document.addEventListener('visibilitychange',function(){run=!document.hidden;if(run&&!rm)requestAnimationFrame(frame)});
})();
</script>
