/* router with transition lock */
var stage=$('#stage'),home=$('#home'),view=$('#view'),busy=false,pending=null,warp=0;
function route(){
  var h=(location.hash||'#home').slice(1).split('/'),k=h[0],sub=h[1];
  if(busy){pending=true;return}
  busy=true;warp=1;stage.classList.add('out');
  setTimeout(function(){
    if(k==='home'||!V[k]){home.classList.add('on');view.classList.remove('on')}
    else{home.classList.remove('on');view.innerHTML=k==='services'&&sub?V.service(sub):V[k]();view.classList.add('on');view.scrollTop=0;
      var hd=view.querySelector('h2');if(hd){hd.setAttribute('tabindex','-1');hd.focus({preventScroll:true})}}
    stage.classList.remove('out');
    setTimeout(function(){busy=false;warp=0;if(pending){pending=null;route()}},420);
  },300);
}
addEventListener('hashchange',function(){closeMenu(true);route()});
if(location.hash&&location.hash!=='#home'){home.classList.remove('on')}route();

/* menu */
var panel=$('#panel'),mb=$('#menuBtn'),last=null;
function openMenu(){last=document.activeElement;panel.classList.add('open');mb.setAttribute('aria-expanded','true');setTimeout(function(){panel.querySelector('a').focus()},50)}
function closeMenu(q){if(!panel.classList.contains('open'))return;panel.classList.remove('open');mb.setAttribute('aria-expanded','false');if(!q&&last)last.focus()}
mb.onclick=openMenu;$('#closeBtn').onclick=function(){closeMenu()};
addEventListener('keydown',function(e){
  if(e.key==='Escape')closeMenu();
  if(e.key==='Tab'&&panel.classList.contains('open')){var f=panel.querySelectorAll('a,button'),a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
$('#ctaBtn').onclick=function(){
  if(innerWidth<960){openMenu();return}
  orbit.querySelectorAll('.node').forEach(function(n,i){n.classList.remove('pulse');void n.offsetWidth;n.style.animationDelay=(i*90)+'ms';n.classList.add('pulse')});
  orbit.querySelector('.node').focus();
};

/* particle field */
var cv=$('#bg'),cx=cv.getContext('2d'),P=[],mx=0,my=0,tx=0,ty=0,run=true,W0,H0,rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){var d=Math.min(devicePixelRatio||1,2);W0=innerWidth;H0=innerHeight;cv.width=W0*d;cv.height=H0*d;cx.setTransform(d,0,0,d,0,0)}
function init(){size();P=[];var n=W0<700?55:W0<1200?90:130,m=Math.min(W0,H0);
  for(var i=0;i<n;i++)P.push({r:(.12+Math.random()*.62)*m*1.1,a:Math.random()*6.283,s:(.00018+Math.random()*.0004)*(Math.random()<.5?-1:1),k:.55+Math.random()*.25,c:Math.random()<.6?'96,165,250':Math.random()<.5?'34,211,238':'139,92,246'})}
function frame(){
  if(!run)return;
  tx+=(mx-tx)*.05;ty+=(my-ty)*.05;
  var cxn=W0/2+tx*18,cyn=H0/2+ty*12,sp=warp?9:1;
  cx.clearRect(0,0,W0,H0);
  for(var i=0;i<P.length;i++){var p=P[i];if(!rm)p.a+=p.s*sp*16;p.x=cxn+Math.cos(p.a)*p.r;p.y=cyn+Math.sin(p.a)*p.r*p.k}
  for(i=0;i<P.length;i++){var a=P[i];
    for(var j=i+1;j<P.length;j++){var b=P[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
      if(d<9000){cx.strokeStyle='rgba(96,165,250,'+(.16*(1-d/9000))+')';cx.lineWidth=1;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}
    cx.fillStyle='rgba('+a.c+',.85)';cx.beginPath();cx.arc(a.x,a.y,1.6,0,6.283);cx.fill()}
  if(!rm)requestAnimationFrame(frame);
}
init();frame();
addEventListener('resize',function(){init();if(rm)frame()});
addEventListener('pointermove',function(e){if(e.pointerType==='mouse'){mx=e.clientX/W0-.5;my=e.clientY/H0-.5}});
document.addEventListener('visibilitychange',function(){run=!document.hidden;if(run&&!rm)requestAnimationFrame(frame)});
})();
</script>
