    for(var j=i+1;j<P.length;j++){var b=P[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
      if(d<9000){cx.strokeStyle='rgba(96,165,250,'+(.16*(1-d/9000))+')';cx.lineWidth=1;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}
    cx.fillStyle='rgba('+a.c+',.85)';cx.beginPath();cx.arc(a.x,a.y,1.6,0,6.283);cx.fill()}
  if(!rm)requestAnimationFrame(frame);
}
init();frame();
addEventListener('resize',function(){init();if(rm)frame()});
addEventListener('pointermove',function(e){if(e.pointerType==='mouse'){mx=e.clientX/W0-.5;my=e.clientY/H0-.5}});
document.addEventListener('visibilitychange',function(){run=!document.hidden;if(run&&!rm)requestAnimationFrame(frame)});
})();
</script>
